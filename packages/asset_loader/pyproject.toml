[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "asset_loader"
version = "0.2.0"
description = "Lazy multi-source parquet loading of per-asset time-series."
requires-python = ">=3.11"
readme = "README.md"
dependencies = ["polars>=1.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.hatch.build.targets.wheel]
packages = ["src/asset_loader"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
