[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tessa"
version = "0.1.0"
description = "TESSA (Time-series Event Slicing and Source Alignment): lazy multi-source parquet loading."
requires-python = ">=3.11"
readme = "README.md"
dependencies = ["polars>=1.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.hatch.build.targets.wheel]
packages = ["src/tessa"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
