[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sparq"
version = "0.1.0"
description = "Source-Partitioned Asset paRQuet loader: lazy multi-source time-series loading."
requires-python = ">=3.11"
readme = "README.md"
dependencies = ["polars>=1.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.hatch.build.targets.wheel]
packages = ["src/sparq"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
